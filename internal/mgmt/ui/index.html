<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydraVPN for Router</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --line:#dde1e6; --accent:#2b6cb0; --bad:#c53030; --ok:#2f855a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e6e9ec; --card:#1d2126; --line:#2e353c; --accent:#63a4ff; --bad:#fc8181; --ok:#68d391; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; margin-right:auto; }
  nav button { background:none; border:0; padding:6px 10px; color:var(--fg); cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { border-color:var(--accent); color:var(--accent); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  input, select, button.act { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button.act { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.act.bad { background:var(--bad); border-color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  pre { margin:0; white-space:pre-wrap; word-break:break-all; max-height:60vh; overflow:auto; font-size:12px; }
  .lv-error { color:var(--bad); } .lv-warn { color:#b7791f; }
  #login { max-width:360px; margin:15vh auto; }
  .badge { background:var(--ok); color:#fff; border:0; border-radius:10px; padding:2px 9px; font-size:12px; cursor:pointer; }
  progress { width:100%; height:10px; }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h3>HydraVPN for Router</h3>
  <p>Введите токен API / Enter the API token</p>
  <div class="row"><input id="tok" type="password" placeholder="token" style="flex:1"><button class="act" onclick="login()">OK</button></div>
  <small>hydravpn-router api-token</small>
</div>
<div id="app" hidden>
<header>
  <h1>HydraVPN for Router <small id="ver"></small> <button id="upd" class="badge" hidden onclick="tab='status';start()"></button></h1>
  <nav id="nav"></nav>
  <button class="act" onclick="act('/api/v1/reload','POST')">Reload</button>
</header>
<main id="main"></main>
</div>
<script>
const $ = s => document.querySelector(s);
let token = sessionStorage.getItem('token') || '';
let tab = 'status', timer, updating = false;
const tabs = {status:'Статус', subs:'Подписки', nodes:'Узлы', servers:'Серверы', rules:'Правила', mapper:'Маппер', genconfig:'Конфиг', keenetic:'Keenetic', logs:'Журнал', checks:'Диагностика'};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { sessionStorage.removeItem('token'); token=''; start(); throw new Error('unauthorized'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function act(path, method, body){
  try { await api(path, method, body); render(); } catch(e){ alert(e.message); }
}
function login(){ token = $('#tok').value; sessionStorage.setItem('token', token); start(); }

async function start(){
  clearInterval(timer);
  if (!token) { $('#login').hidden = false; $('#app').hidden = true; return; }
  try {
    const v = await api('/api/v1/version');
    $('#ver').textContent = v.version;
    api('/api/v1/update').then(showBadge).catch(() => {});
  } catch(e) { $('#login').hidden = false; $('#app').hidden = true; return; }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#nav').innerHTML = Object.entries(tabs).map(([k,v]) => `<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('');
  $('#nav').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; start(); } };
  render();
  timer = setInterval(() => { if (!updating && (tab==='status' || tab==='logs')) render(); }, 5000);
}

async function render(){
  const m = $('#main');
  try {
    if (tab === 'status') {
      const s = await api('/api/v1/status');
      const p = s.providers || {};
      m.innerHTML = `<div class="card"><table>
        <tr><th>Состояние</th><td class="${s.state==='running'?'ok':'bad'}">${esc(s.state)}</td></tr>
        <tr><th>Версия / Uptime</th><td>${esc(s.version)} / ${esc(s.uptime)}</td></tr>
        <tr><th>Перезагрузок / Ошибок</th><td>${s.reload_count} / ${s.error_count}</td></tr>
        <tr><th>Последняя ошибка</th><td>${esc(s.last_error)}</td></tr>
        <tr><th>sing-box</th><td>${p.singbox ? (p.singbox.running?'<span class=ok>running</span>':'<span class=bad>stopped</span>')+' pid '+p.singbox.pid : '-'}</td></tr>
        <tr><th>Firewall</th><td>${s.firewall.running?'<span class=ok>active</span>':'<span class=bad>off</span>'} ${esc(s.firewall.backend)} ${esc(s.firewall.last_error)}</td></tr>
        <tr><th>DNS</th><td>${esc((s.dns.current_servers||[]).join(', '))}</td></tr>
      </table></div>
      ${updateCard(s.update)}
      <div class="card"><b>Компоненты</b><pre>${esc(JSON.stringify(s.components,null,1))}</pre></div>`;
      showBadge(s.update);
    } else if (tab === 'subs') {
      const l = await api('/api/v1/subscriptions'), st = (await api('/api/v1/status')).subscriptions.subscriptions || {};
      m.innerHTML = `<div class="card"><table><tr><th>#</th><th>Секция</th><th>URL</th><th>Обновление</th><th></th></tr>` +
        l.map(x => { const info = Object.values(st).find(v => v.section===x.section) || {};
          return `<tr><td>${x.index}</td><td>${esc(x.section)}</td><td>${esc(x.url)}</td><td>${esc(info.last_update||'')} ${info.last_error?'<span class=bad>'+esc(info.last_error)+'</span>':''} (${info.outbounds??0})</td>
          <td><button class=act data-a="refresh-sub" data-i="${x.index}">↻</button> <button class="act bad" data-a="del-sub" data-i="${x.index}">✕</button></td></tr>`; }).join('') + `</table></div>
        <div class="card"><b>Добавить подписку</b><div class="row"><input id="ss" placeholder="секция"><input id="su" placeholder="https://…" style="flex:1"><button class=act onclick="addSub()">Добавить</button></div></div>`;
    } else if (tab === 'nodes') {
      const n = await api('/api/v1/nodes');
      const groups = n.filter(x => x.members);
      m.innerHTML = groups.map(g => `<div class="card"><b>${esc(g.name)}</b> <small>${esc(g.type)}</small><table>` +
        g.members.map(mm => { const nd = n.find(x => x.name===mm) || {};
          return `<tr><td>${g.now===mm?'●':''}</td><td>${esc(mm)}</td><td>${nd.delay_ms?nd.delay_ms+' ms':''}</td><td>
          ${g.type==='Selector'?`<button class=act data-a="select" data-g="${esc(g.name)}" data-n="${esc(mm)}">выбрать</button>`:''}
          <button class=act data-a="test" data-n="${esc(mm)}">тест</button></td></tr>`; }).join('') + `</table></div>`).join('') || '<div class=card>Нет групп</div>';
    } else if (tab === 'servers') {
      const l = await api('/api/v1/servers');
      m.innerHTML = `<div class="card"><table><tr><th>Имя</th><th>Протокол</th><th>Порт</th><th></th></tr>` +
        l.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.protocol)}</td><td>${x.listen_port}</td><td><button class="act bad" data-a="del-server" data-n="${esc(x.name)}">✕</button></td></tr>`).join('') + `</table></div>`;
    } else if (tab === 'logs') {
      const l = await api('/api/v1/logs?n=300');
      m.innerHTML = `<div class="card"><pre>` + l.map(e => `<div class="lv-${e.level}">${esc(e.time.slice(11,19))} [${e.level}] ${esc(e.message)}</div>`).join('') + `</pre></div>`;
    } else if (tab === 'checks') {
      m.innerHTML = `<div class="card"><div class="row">` + ['global','dns','singbox','nft','proxy'].map(c => `<button class=act data-a="check" data-n="${c}">${c}</button>`).join('') + `</div><pre id="chk"></pre></div>`;
    } else if (tab === 'rules') await renderRules(m);
    else if (tab === 'mapper') renderMapper(m);
    else if (tab === 'genconfig') renderGenConfig(m);
    else if (tab === 'keenetic') await renderKeenetic(m);
  } catch(e) { m.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const d = b.dataset;
  switch (d.a) {
    case 'refresh-sub': act('/api/v1/subscriptions/' + d.i + '/refresh', 'POST'); break;
    case 'del-sub': if (confirm('Удалить?')) act('/api/v1/subscriptions/' + d.i, 'DELETE'); break;
    case 'del-server': if (confirm('Удалить?')) act('/api/v1/servers/' + encodeURIComponent(d.n), 'DELETE'); break;
    case 'select': act('/api/v1/nodes/select', 'POST', {group: d.g, node: d.n}); break;
    case 'test': testNode(d.n, b); break;
    case 'check': runCheck(d.n); break;
    case 'upd-check': checkUpdate(b); break;
    case 'upd-start': startUpdate(d.v); break;
    case 'rules-save': saveRules(); break;
    case 'map-run': runMapper(false); break;
    case 'map-apply': if (confirm('Добавить маршруты в роутер через ndmc?')) runMapper(true); break;
    case 'gen-run': runGenConfig(); break;
    case 'kn-proxy': keeneticProxy(d.apply === '1'); break;
  }
});
async function addSub(){ await act('/api/v1/subscriptions','POST',{section:$('#ss').value,url:$('#su').value}); }
async function testNode(n,b){ b.textContent='…'; try { const r = await api('/api/v1/nodes/test','POST',{node:n}); b.textContent = r.delay_ms+' ms'; } catch(e){ b.textContent='✕'; } }
async function runCheck(c){ $('#chk').textContent='…'; try { $('#chk').textContent = JSON.stringify(await api('/api/v1/check/'+c),null,1); } catch(e){ $('#chk').textContent=e.message; } }
// ---------------------------------------------------------------- rules (MagiTrickle-style)
let rulesSection = '';
const ruleKinds = [
  ['namespace:', 'Домен и все поддомены (namespace)'],
  ['full:', 'Только этот домен (exact)'],
  ['wildcard:', 'Шаблон: * любые символы, ? один символ'],
  ['regexp:', 'Регулярное выражение (RE2)'],
  ['keyword:', 'Любой домен со словом'],
];
async function renderRules(m){
  const secs = await api('/api/v1/sections');
  if (!secs.length) { m.innerHTML = '<div class="card">Секций нет. Добавьте секцию в конфиге или через API.</div>'; return; }
  if (!secs.some(x => x.name === rulesSection)) rulesSection = secs[0].name;
  const sec = secs.find(x => x.name === rulesSection);
  window._sec = sec;
  m.innerHTML = `<div class="card"><b>Правила доменов секции</b>
    <div class="row"><select id="rsec" onchange="rulesSection=this.value;render()">${secs.map(x => `<option ${x.name===rulesSection?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <small>${esc(sec.action)} / ${esc(sec.provider || 'singbox')}${sec.enabled ? '' : ' (отключена)'}</small></div>
    <textarea id="rtxt" rows="12" style="width:100%;font:12px monospace" placeholder="youtube.com&#10;full:exact.example.com&#10;wildcard:cdn*.video.example&#10;keyword:tracker&#10;203.0.113.0/24">${esc((sec.domains||[]).join('\n'))}</textarea>
    <small>${ruleKinds.map(([k,v]) => `<code>${k}</code> ${esc(v)}`).join('<br>')}<br>Без префикса — домен и поддомены; сети (CIDR) добавляются как есть.</small>
    <div class="row"><button class=act data-a="rules-save">Сохранить и применить</button></div></div>`;
}
async function saveRules(){
  const sec = window._sec; if (!sec) return;
  sec.domains = $('#rtxt').value.split('\n').map(x => x.trim()).filter(Boolean);
  try { await api('/api/v1/sections/' + encodeURIComponent(sec.name), 'PUT', sec); await api('/api/v1/reload', 'POST'); alert('Сохранено'); } catch(e){ alert(e.message); }
}
// ---------------------------------------------------------------- domain mapper (DomainMapper / HydraRoute)
const mapFormats = ['plain','keenetic-cli','keenetic-bat','mikrotik','wireguard','openvpn','nft','ipset','json'];
function renderMapper(m){
  m.innerHTML = `<div class="card"><b>Маппер доменов → IP-маршруты</b>
    <p><small>Домены резолвятся через все выбранные DNS и сворачиваются в подсети: статические маршруты Keenetic, MikroTik, WireGuard, OpenVPN.</small></p>
    <textarea id="mdom" rows="8" style="width:100%;font:12px monospace" placeholder="по одному домену или подсети в строке"></textarea>
    <div class="row"><input id="mlist" placeholder="URL списков https://… (через пробел)" style="flex:1"></div>
    <div class="row">
      <select id="magg"><option>24+32</option><option>24</option><option>16</option><option>host</option></select>
      <select id="mfmt">${mapFormats.map(f => `<option>${f}</option>`).join('')}</select>
      <input id="mif" placeholder="интерфейс (Wireguard0)">
      <input id="mdns" placeholder="DNS через пробел (по умолчанию из конфига)">
    </div>
    <div class="row"><label><input type="checkbox" id="mcf"> без Cloudflare</label> <label><input type="checkbox" id="mv6"> IPv6</label></div>
    <div class="row"><button class=act data-a="map-run">Построить</button> <button class=act data-a="map-apply">Добавить в Keenetic (ndmc)</button></div>
    <pre id="mout"></pre></div>`;
}
async function runMapper(apply){
  const out = $('#mout'); out.textContent = 'Резолвинг…';
  const split = v => v.split(/\s+/).filter(Boolean);
  try {
    const r = await api('/api/v1/domainmap', 'POST', {
      domains: $('#mdom').value.split('\n').map(x => x.trim()).filter(Boolean), lists: split($('#mlist').value), dns: split($('#mdns').value),
      aggregate: $('#magg').value, format: $('#mfmt').value, interface: $('#mif').value, no_cloudflare: $('#mcf').checked, ipv6: $('#mv6').checked, apply });
    out.textContent = `# маршрутов: ${r.routes}${r.failed && r.failed.length ? ', без адреса: ' + r.failed.join(', ') : ''}${r.applied ? ', добавлено в роутер: ' + r.applied : ''}\n` + r.output;
  } catch(e){ out.textContent = e.message; }
}
// ---------------------------------------------------------------- config generator (NeoFit)
function renderGenConfig(m){
  m.innerHTML = `<div class="card"><b>Генератор конфига Xray / sing-box</b>
    <div class="row"><input id="glink" placeholder="vless://… trojan://… ss://… hysteria2://…" style="flex:1">
    <select id="gcore"><option>xray</option><option>sing-box</option></select></div>
    <div class="row"><button class=act data-a="gen-run">Сгенерировать</button></div><pre id="gout"></pre></div>`;
}
async function runGenConfig(){
  try { $('#gout').textContent = (await api('/api/v1/genconfig', 'POST', {link: $('#glink').value.trim(), core: $('#gcore').value})).config; }
  catch(e){ $('#gout').textContent = e.message; }
}
// ---------------------------------------------------------------- KeeneticOS
async function renderKeenetic(m){
  const k = await api('/api/v1/keenetic');
  m.innerHTML = `<div class="card"><b>KeeneticOS</b> ${k.available ? '<span class=ok>ndmc найден</span>' : '<span class=bad>ndmc не найден (не KeeneticOS)</span>'}
    <table><tr><th>Интерфейс</th><th>Тип</th><th>Состояние</th><th>Описание</th></tr>` +
    k.interfaces.map(i => `<tr><td>${esc(i.ID)}</td><td>${esc(i.Type)}</td><td class="${i.Connected?'ok':''}">${i.Connected?'up':'down'}</td><td>${esc(i.Description)}</td></tr>`).join('') + `</table></div>
    <div class="card"><b>Proxy-интерфейс</b><p><small>Создаёт в Keenetic интерфейс Proxy, направленный на локальный прокси сервиса, чтобы использовать его в политиках доступа.</small></p>
    <div class="row"><input id="kpn" value="Proxy0"><input id="kpp" value="4534" size="6">
    <button class=act data-a="kn-proxy" data-apply="0">Показать команды</button>
    <button class=act data-a="kn-proxy" data-apply="1">Применить</button></div><pre id="kout"></pre></div>`;
}
async function keeneticProxy(apply){
  if (apply && !confirm('Выполнить команды ndmc и сохранить конфигурацию роутера?')) return;
  try {
    const r = await api('/api/v1/keenetic/proxy', 'POST', {name: $('#kpn').value, port: parseInt($('#kpp').value, 10), apply});
    $('#kout').textContent = r.commands.join('\n') + (r.applied ? '\n# применено' : '');
  } catch(e){ $('#kout').textContent = e.message; }
}
// ---------------------------------------------------------------- update
const updStates = {idle:'', checking:'проверка…', downloading:'загрузка…', verifying:'проверка файла…', installing:'установка…', restarting:'перезапуск…', failed:'ошибка'};
function showBadge(u){
  const b = $('#upd'); if (!b) return;
  b.hidden = !(u && u.update_available && u.supported);
  if (!b.hidden) b.textContent = '↑ ' + u.latest;
}
function updateCard(u){
  if (!u) return '';
  const rows = [
    ['Установлена', esc(u.current)],
    ['Последний релиз', u.latest ? `${esc(u.latest)} ${u.release_url ? `<a href="${esc(u.release_url)}" target="_blank" rel="noopener">что нового</a>` : ''}` : '—'],
    ['Проверено', esc(u.checked || '—')],
  ];
  if (u.state && u.state !== 'idle') rows.push(['Состояние', `<span class="${u.state==='failed'?'bad':''}">${esc(updStates[u.state] || u.state)}</span>`]);
  if (u.error) rows.push(['Ошибка', `<span class=bad>${esc(u.error)}</span>`]);
  let actions = '';
  if (!u.supported) actions = `<small>Обновление из интерфейса недоступно: ${esc(u.unsupported_reason)}</small>`;
  else {
    actions = `<button class=act data-a="upd-check">Проверить</button>`;
    if (u.update_available) actions += ` <button class=act data-a="upd-start" data-v="${esc(u.latest)}">Обновить до ${esc(u.latest)}</button>`;
    else if (u.latest) actions += ` <span class=ok>Установлена последняя версия</span>`;
  }
  return `<div class="card"><b>Обновление</b><table>${rows.map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table><div class="row">${actions}</div></div>`;
}
async function checkUpdate(b){
  b.textContent = '…';
  try { await api('/api/v1/update/check', 'POST'); } catch(e) {}
  render();
}
async function startUpdate(v){
  if (!confirm(`Обновить HydraVPN for Router до ${v}?
Сервис перезапустится, маршрутизация прервётся на несколько секунд.`)) return;
  try { await api('/api/v1/update', 'POST', {version: v}); } catch(e) { alert(e.message); return; }
  watchUpdate(v);
}
// Shows progress until the service comes back with the new version. While it
// restarts the API is unreachable for a few seconds; that is expected.
async function watchUpdate(v){
  updating = true;
  const m = $('#main'), began = Date.now();
  const show = (text, pct, bad) => { m.innerHTML = `<div class="card"><b>Обновление до ${esc(v)}</b><p class="${bad?'bad':''}">${esc(text)}</p>${pct==null?'':`<progress max="100" value="${pct}"></progress>`}</div>`; };
  let restarting = false;
  while (Date.now() - began < 10*60*1000) {
    await new Promise(r => setTimeout(r, 1500));
    if (!restarting) {
      try {
        const u = await api('/api/v1/update');
        if (u.state === 'failed') { show('Не удалось обновить: ' + (u.error || ''), null, true); updating = false; return; }
        if (u.state === 'restarting') { restarting = true; continue; }
        const pct = u.size_bytes > 0 ? Math.round(100 * u.downloaded_bytes / u.size_bytes) : null;
        show(updStates[u.state] || u.state, pct);
      } catch(e) { restarting = true; }
    } else {
      show('Перезапуск сервиса…');
      try {
        const r = await api('/api/v1/version');
        if (r.version === v) { updating = false; alert('Обновлено до ' + v); start(); return; }
      } catch(e) { /* still restarting */ }
    }
  }
  updating = false;
  show('Сервис не ответил новой версией за 10 минут. Проверьте журнал: logread -e hydravpn-router', null, true);
}
start();
</script>
</body>
</html>
