name: Upstream

# Weekly: compare docs/components.tsv with the latest releases of the
# components we run or follow, and open an issue when one is newer.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          sh scripts/check-upstream.sh | tee /tmp/upstream.txt
          echo "newer=$(grep -c '^NEWER' /tmp/upstream.txt)" >> "$GITHUB_OUTPUT"
      # One open issue at a time: a weekly run updates it instead of adding
      # a duplicate, and comments only when the report changed.
      - name: Open or update the issue
        if: steps.cmp.outputs.newer != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Component updates available
        run: |
          body="$(printf 'See docs/COMPONENTS.md for the update procedure.\n\n```\n%s\n```\n' "$(cat /tmp/upstream.txt)")"
          num="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body"
          elif [ "$(gh issue view "$num" --json body --jq .body)" != "$body" ]; then
            gh issue edit "$num" --body "$body"
            gh issue comment "$num" --body "The report changed:$(printf '\n\n```\n%s\n```' "$(cat /tmp/upstream.txt)")"
          fi
