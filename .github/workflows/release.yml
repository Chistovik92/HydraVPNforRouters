name: Release

# Runs when a vX.Y.Z tag is pushed. The tag must match pkg/version/version.go,
# so a tag can never publish a build that reports another version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Tag matches the source version
        run: sh scripts/check-version.sh "${GITHUB_REF_NAME}"

      - name: Test
        run: go test -count=1 ./...

      - name: Binaries and packages (OpenWrt, KeeneticOS)
        # hydravpn-router-<ver>-<openwrt|keeneticos|routeros>-<arch>,
        # hydravpn-router-<openwrt|keeneticos>_<ver>_<arch>.ipk, sizes.md
        run: bash scripts/build.sh "${GITHUB_REF_NAME#v}" dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: RouterOS container images
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          for t in "arm64|linux/arm64" "armv7|linux/arm/v7" "amd64|linux/amd64"; do
            arch=${t%%|*}; platform=${t#*|}
            docker buildx build --platform "$platform" --build-arg VERSION="$V"               -t "hydravpn-router:$V"               --output "type=docker,dest=dist/hydravpn-router-routeros-$V-$arch.tar" .
          done
          (cd dist && sha256sum hydravpn-router-routeros-*.tar >> checksums.txt)

      - name: Container image (registry)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr A-Z a-z)/hydravpn-router"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7             --build-arg VERSION="$V" -t "$IMAGE:$V" -t "$IMAGE:latest" --push .

      - name: Release notes
        run: |
          {
            echo
            echo "### Packages and installed size"
            echo
            cat dist/sizes.md
            echo
            echo "RouterOS images: hydravpn-router-routeros-${GITHUB_REF_NAME#v}-<arm64|armv7|amd64>.tar"
          } >> dist/RELEASE_NOTES.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "${GITHUB_REF_NAME}" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $FLAGS \
            --title "HydraVPN for Router ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/hydravpn-router-* dist/checksums.txt dist/sizes.md scripts/install.rsc
