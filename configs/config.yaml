# HydraVPN for Router Default Configuration
# Copy to /etc/podkop-plus/config.yaml and modify as needed

settings:
  config_version: "1.0.0"
  applied_migrations: []
  
  # DNS Settings
  dns_type: "udp"
  dns_server:
    - "77.88.8.8"
    - "77.88.8.1"
  bootstrap_dns_server:
    - "77.88.8.8"
    - "77.88.8.1"
  dns_check_interval: "10s"
  dns_recovery_check_interval: "60s"
  dns_check_timeout: "2s"
  dns_rewrite_ttl: 60
  dns_strategy: "prefer_ipv4"
  dns_detour_enabled: false
  # dns_detour_section: "main"
  
  # Network Interface Settings
  source_network_interfaces:
    - "br-lan"
  enable_output_network_interface: false
  # output_network_interface: "wan"
  enable_badwan_interface_monitoring: false
  # badwan_monitored_interfaces:
  #   - "wan"
  # badwan_reload_delay: 2000
  
  # Feature Flags
  enable_yacd: false
  disable_quic: false
  
  # Update Settings
  list_update_enabled: true
  update_interval: "24h"
  component_update_check_enabled: true
  component_update_check_interval: "24h"
  
  # Proxy Settings
  latency_test_url: "https://www.gstatic.com/generate_204"
  download_lists_via_proxy: false
  download_components_via_proxy: false
  # download_lists_via_proxy_section: "main"
  # download_components_via_proxy_section: "main"
  
  # DHCP Handling
  dont_touch_dhcp: false
  
  # Paths
  config_path: "/etc/podkop-plus/sing-box/config.json"
  cache_path: "/tmp/podkop-plus/cache.db"
  
  # Logging
  log_level: "warn"
  
  # NTP
  exclude_ntp: false
  
  # Shutdown
  shutdown_correctly: false

